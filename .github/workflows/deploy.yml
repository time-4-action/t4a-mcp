# check -> deploy -> verify.
#
# Checks every pull request and every push to main. On main, a green check
# builds the image, pushes it to GHCR tagged with the commit SHA and
# `latest`, and rolls the production container onto that exact SHA over SSH,
# rolling back to the previous image if it does not come up healthy on that
# commit. `verify` then checks the public URL through nginx reports that
# commit. The VM only pulls; see docs/deployment.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request supersedes the running check. On main
# runs are never cancelled, only queued, so an older commit can never be
# deployed over a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/time-4-action/t4a-mcp
  # Overridable with the PRODUCTION_URL repository variable.
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://mcp.time-4-action.com' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # There is no test suite yet. Syntax errors and undefined names fail the
      # pull request instead of the deploy that would crash-loop on them.
      - name: Lint (syntax errors, undefined names)
        run: |
          pip install --quiet ruff==0.6.9
          ruff check --select E9,F63,F7,F82 --target-version py311 src app

      # Pull requests only: proves the Dockerfile and requirements.txt still
      # build, and that every tool and pipeline module imports inside the
      # image. On main the deploy job builds anyway.
      - if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          platforms: linux/amd64
          tags: t4a-mcp:check
          cache-from: type=gha
      # Proves the installed packages actually import. The MCP tools and
      # src.server.app connect to ChromaDB (src/vectorstore/manager.py) on
      # import, so they are left out; everything that imports without a
      # running service is in.
      - if: github.event_name == 'pull_request'
        name: Import smoke test
        run: |
          docker run --rm t4a-mcp:check python -c "
          import app.retrieval, app.pipeline, app.routes.upload_file, app.routes.add_url
          import app.routes.add_urls_bulk, app.routes.upload_sitemap, app.routes.reindex
          import app.routes.sources, app.routes.search_test
          import src.config, src.server.auth, src.server.permissions, src.server.scheduler
          print('imports ok')"

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The PROD_DEPLOY_* SSH secrets are organization secrets. GHCR needs none:
    # the job's own GITHUB_TOKEN pushes the image and lets the VM pull it.
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          # GIT_SHA is baked in as APP_VERSION, which the deploy and /health check.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          # The SSH login on the VM; override with the DEPLOY_USER variable.
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_DEPLOY_FINGERPRINT }}
          timeout: 30s
          command_timeout: 20m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -u
            cd ${{ vars.DEPLOY_DIR || '/data/stack/apps/time-4-action/mcp' }} || exit 1
            SHA=${{ github.sha }}
            NEW=${{ env.IMAGE }}:$SHA
            SVC=t4a-mcp

            # The image the service runs now is what a failed deploy goes back to.
            PREV=""
            CID=$(docker compose ps -q $SVC 2>/dev/null || true)
            if [ -n "$CID" ]; then
              PREV=$(docker inspect --format '{{.Config.Image}}' "$CID")
            fi
            echo "running: ${PREV:-nothing}  deploying: $NEW"

            # Startup connects to ChromaDB and downloads + loads the reranker
            # model before it listens, so this allows three minutes. /health
            # answers 200 even when ChromaDB or MongoDB is degraded, so a
            # database outage never triggers a rollback.
            healthy() {
              for i in $(seq 1 90); do
                curl -fsS http://127.0.0.1:8000/health >/dev/null && return 0
                sleep 2
              done
              curl -sS http://127.0.0.1:8000/health || true
              return 1
            }

            # Healthy is not enough: the container must be running the image
            # built from this commit, not one left over.
            on_commit() {
              RUNNING=$(docker compose exec -T $SVC printenv APP_VERSION 2>/dev/null || true)
              echo "$SVC reports APP_VERSION=${RUNNING:-none}"
              [ "$RUNNING" = "$SHA" ]
            }

            # The pull logs in with this job's GITHUB_TOKEN, which expires when
            # the job ends, and logs out again on every exit: the VM keeps no
            # registry credential. Rollback needs none, the previous image is local.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null || exit 1

            export APP_IMAGE=$NEW
            # A failed pull changes nothing on the server. Retried, because
            # registries have transient failures.
            for i in 1 2 3; do
              docker compose pull $SVC && break
              [ "$i" = 3 ] && exit 1
              echo "pull failed, retrying"; sleep 10
            done

            # Only the app is recreated; chromadb keeps running (`up` starts it
            # if it is down, since t4a-mcp depends on it).
            if docker compose up -d --remove-orphans $SVC && healthy && on_commit; then
              echo "healthy on $NEW"
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi

            echo "deploy of $NEW failed"
            docker compose logs --tail=50 $SVC

            if [ -z "$PREV" ] || [ "$PREV" = "$NEW" ]; then
              echo "no previous image to roll back to"
              exit 1
            fi

            echo "rolling back to $PREV"
            export APP_IMAGE=$PREV
            if docker compose up -d $SVC && healthy; then
              echo "rolled back to $PREV"
            else
              echo "rollback is not healthy either"
              docker compose logs --tail=50 $SVC
            fi
            exit 1

  # From outside: DNS, TLS and the host nginx in front of the container the
  # deploy job already checked on loopback. The public /health must report the
  # commit just deployed.
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Public health check
        run: |
          for _ in $(seq 1 10); do
            BODY=$(curl -fsS --max-time 10 "$PRODUCTION_URL/health" 2>&1) \
              && echo "$BODY" | jq -e --arg v "$GITHUB_SHA" '.version == $v' >/dev/null \
              && { echo "$BODY"; exit 0; }
            sleep 6
          done
          echo "$BODY"
          echo "::error::$PRODUCTION_URL/health does not report version $GITHUB_SHA"
          exit 1
