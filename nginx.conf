server
{
        listen 80;
        server_name t4a.etiam.si *.t4a.etiam.si;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
}

server
{
        listen 80;
        listen 443 ssl;

        # Include hardened SSL snippet
        include /etc/nginx/snippets/ssl-t4a-etiam.si.conf;

        # Match any subdomain with at least two levels before etiam.si
        server_name ~^.+\..+\.etiam\.si$;

        # Optional: SSL config if HTTPS is enabled
        # ssl_certificate /path/to/fullchain.pem;
        # ssl_certificate_key /path/to/privkey.pem;

        return 301 https://export.time-4-action.com$request_uri;
}

server
{
        listen 443 ssl http2;
        server_name sync.t4a.etiam.si;

        # Include hardened SSL snippet
        include /etc/nginx/snippets/ssl-t4a-etiam.si.conf;

        location /
        {
                proxy_pass http://localhost:3000;

                # Standard proxy headers
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # --- WebSockets Configuration ---
                # The two directives below are critical for passing WebSocket traffic
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                # --------------------------------
        }

        # Optional logging
        access_log /var/log/nginx/t4.etiam.si.access.log;
        error_log /var/log/nginx/t4a.etiam.si.error.log;
}
server
{
        listen 443 ssl http2;
        server_name api.time-4-action.com;

        include /etc/nginx/snippets/ssl-t4a.conf;

        # CORS for ALL /api/ endpoints (covers /api/export/custom-export)
        location ^~ /api/
        {

                # --- Handle preflight here, BEFORE proxy ---
                if ($request_method = OPTIONS)
                {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
                        add_header 'Access-Control-Max-Age' 86400 always;
                        add_header 'Content-Length' 0;
                        add_header 'Content-Type' 'text/plain; charset=utf-8';
                        return 204;
                }

                # --- Actual requests ---
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Expose-Headers' 'Content-Disposition' always;
                add_header 'Vary' 'Origin' always;

                proxy_pass http://localhost:3001;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
}


server
{
        listen 443 ssl http2;
        server_name chat.time-4-action.com;

        include /etc/nginx/snippets/ssl-t4a.conf;

        location /
        {
                proxy_pass http://localhost:3003;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_http_version 1.1;
                proxy_set_header Connection '';

                # Required for Next.js SSE streaming (chat responses)
                proxy_buffering off;
                proxy_cache off;
                add_header X-Accel-Buffering "no";

                # Fix: Auth0 callback sends large headers/cookies
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
        }

        access_log /var/log/nginx/t4.etiam.si.access.log;
        error_log /var/log/nginx/t4a.etiam.si.error.log;
}


server
{
        listen 443 ssl http2;
        server_name export.time-4-action.com;

        # Include hardened SSL snippet
        include /etc/nginx/snippets/ssl-t4a.conf;

        # Backend for everything else
        location /
        {
                proxy_pass http://localhost:3002;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";

                # Fix: upstream sent too big header
                proxy_buffer_size 128k;
                proxy_buffers 4 256k;
                proxy_busy_buffers_size 256k;
        }

        # Optional logging
        access_log /var/log/nginx/t4.etiam.si.access.log;
        error_log /var/log/nginx/t4a.etiam.si.error.log;
}

server
{
        listen 443 ssl http2;
        server_name mcp.time-4-action.com;
        include /etc/nginx/snippets/ssl-t4a.conf;

        location /
        {
                # Handle CORS preflight at nginx level — bypasses AuthMiddleware
                # which would return 401 on OPTIONS (no Authorization header present)
                if ($request_method = OPTIONS)
                {
                        add_header 'Access-Control-Allow-Origin' '*' always;
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, Mcp-Session-Id' always;
                        add_header 'Access-Control-Max-Age' 86400 always;
                        add_header 'Content-Length' 0;
                        add_header 'Content-Type' 'text/plain; charset=utf-8';
                        return 204;
                }

                proxy_pass http://localhost:8000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # Pass Authorization header (Bearer JWT) to the upstream Python app
                proxy_set_header Authorization $http_authorization;

                proxy_http_version 1.1;
                proxy_set_header Connection '';

                proxy_buffering off;
                proxy_cache off;
                add_header X-Accel-Buffering "no";
                add_header Cache-Control "no-cache";

                proxy_read_timeout 86400s;
                proxy_connect_timeout 75s;

                chunked_transfer_encoding on;
        }

        access_log /var/log/nginx/mcp.time-4-action.com.access.log;
        error_log /var/log/nginx/mcp.time-4-action.com.error.log;
}

server
{
        listen 80;
        server_name mcp.time-4-action.com;
        return 301 https://$host$request_uri;
}