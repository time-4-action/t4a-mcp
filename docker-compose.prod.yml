version: '3.8'

services:
  t4a-mcp:
    # Pull pre-built image from Docker Hub
    image: etiamsi/t4a-mcp:latest
    container_name: t4a-mcp
    restart: unless-stopped

    # Port mapping
    ports:
      - "8000:8000"

    # Load all environment variables from .env file
    env_file:
      - .env

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
